<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetare Parola - Note In demisol</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="background">
        <img src="assets/background.png" alt="" class="bg-image">
    </div>
    <div class="bg-overlay"></div>
    <div class="auth-page">
        <div class="auth-card">
            <h1>Note <span>In</span> Demisol</h1>
            <h2>Resetare Parola</h2>
            <div id="resetMsg" class="auth-error" style="display:none"></div>
            <div id="step1">
                <p class="auth-info">Introdu emailul cu care te-ai inregistrat. Vei primi un cod de resetare.</p>
                <form class="auth-form" id="forgotForm" novalidate>
                    <div class="auth-input-wrap">
                        <input type="email" id="resetEmail" placeholder="Email-ul tau" required autocomplete="email">
                    </div>
                    <button type="submit" class="auth-btn" id="forgotBtn">Trimite codul</button>
                </form>
            </div>
            <div id="step2" style="display:none">
                <p class="auth-info">Introdu codul primit pe email si noua parola.</p>
                <form class="auth-form" id="resetForm" novalidate>
                    <div class="auth-input-wrap">
                        <input type="text" id="resetCode" placeholder="Codul de resetare" required>
                    </div>
                    <div class="auth-input-wrap">
                        <input type="password" id="newPass" placeholder="Noua parola (minim 6 caractere)" required autocomplete="new-password">
                        <button type="button" class="password-toggle" id="toggleResetPass" tabindex="-1">Arata</button>
                    </div>
                    <div class="auth-input-wrap">
                        <input type="password" id="newPass2" placeholder="Confirma noua parola" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="auth-btn" id="resetBtn">Reseteaza parola</button>
                </form>
            </div>
            <p class="auth-switch"><a href="login.html">&#8592; Inapoi la autentificare</a></p>
            <a href="index.html" class="auth-back">&#8592; Inapoi la site</a>
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="emailjs-config.js"></script>
    <script>
    (function() {
        var resetEmail = '';
        var msg = document.getElementById('resetMsg');
        var forgotBtn = document.getElementById('forgotBtn');
        var resetBtn = document.getElementById('resetBtn');
        var resetPassInput = document.getElementById('newPass');
        var resetToggle = document.getElementById('toggleResetPass');

        emailjs.init(EMAILJS_CONFIG.PUBLIC_KEY);

        if (resetToggle) {
            resetToggle.addEventListener('click', function() {
                var isPass = resetPassInput.type === 'password';
                resetPassInput.type = isPass ? 'text' : 'password';
                resetToggle.textContent = isPass ? 'Ascunde' : 'Arata';
            });
        }

        function isEmailJSConfigured() {
            return EMAILJS_CONFIG.PUBLIC_KEY.indexOf('aici_pune') === -1
                && EMAILJS_CONFIG.SERVICE_ID.indexOf('aici_pune') === -1
                && EMAILJS_CONFIG.TEMPLATE_ID.indexOf('aici_pune') === -1;
        }

        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var email = document.getElementById('resetEmail').value.trim();
            if (!email) {
                msg.textContent = 'Introdu emailul';
                msg.className = 'auth-error';
                msg.style.display = 'block';
                return;
            }
            forgotBtn.disabled = true;
            forgotBtn.classList.add('loading');
            var result = NIDAuth.forgotPassword(email);
            if (result.ok) {
                if (isEmailJSConfigured()) {
                    emailjs.send(EMAILJS_CONFIG.SERVICE_ID, EMAILJS_CONFIG.TEMPLATE_ID, {
                        email: email,
                        reset_code: result.code,
                        username: result.username || email.split('@')[0]
                    }).then(function() {
                        msg.textContent = 'Un cod de resetare a fost trimis la ' + email + '. Verifica inbox-ul (si spam-ul).';
                        msg.className = 'auth-error success';
                        msg.style.display = 'block';
                        resetEmail = email;
                        forgotBtn.disabled = false;
                        forgotBtn.classList.remove('loading');
                        document.getElementById('step1').style.display = 'none';
                        document.getElementById('step2').style.display = 'block';
                    }, function(err) {
                        console.error('EmailJS error:', err);
                        msg.textContent = 'Nu s-a putut trimite emailul. Verifica ca ai configurat corect EMAILJS in emailjs-config.js. (Vezi consola browser-ului pentru detalii)';
                        msg.className = 'auth-error';
                        msg.style.display = 'block';
                        forgotBtn.disabled = false;
                        forgotBtn.classList.remove('loading');
                    });
                } else {
                    msg.textContent = 'Codul tau de resetare: ' + result.code + ' (pentru testare locala — in productie ar veni pe email). Configureaza EMAILJS in emailjs-config.js';
                    msg.className = 'auth-error success';
                    msg.style.display = 'block';
                    resetEmail = email;
                    forgotBtn.disabled = false;
                    forgotBtn.classList.remove('loading');
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                }
            } else {
                forgotBtn.disabled = false;
                forgotBtn.classList.remove('loading');
                msg.textContent = result.error;
                msg.className = 'auth-error';
                msg.style.display = 'block';
            }
        });

        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var code = document.getElementById('resetCode').value.trim();
            var pass = document.getElementById('newPass').value;
            var pass2 = document.getElementById('newPass2').value;
            if (!code || !pass || !pass2) {
                msg.textContent = 'Completeaza toate campurile';
                msg.className = 'auth-error';
                msg.style.display = 'block';
                return;
            }
            if (pass !== pass2) {
                msg.textContent = 'Parolele nu coincid';
                msg.className = 'auth-error';
                msg.style.display = 'block';
                return;
            }
            if (pass.length < 6) {
                msg.textContent = 'Parola trebuie sa aiba minim 6 caractere';
                msg.className = 'auth-error';
                msg.style.display = 'block';
                return;
            }
            resetBtn.disabled = true;
            resetBtn.classList.add('loading');
            var result = NIDAuth.resetPassword(resetEmail, code, pass);
            resetBtn.disabled = false;
            resetBtn.classList.remove('loading');
            if (result.ok) {
                msg.textContent = 'Parola a fost resetata cu succes! Redirectionare...';
                msg.className = 'auth-error success';
                msg.style.display = 'block';
                setTimeout(function() { window.location.href = 'login.html'; }, 2000);
            } else {
                msg.textContent = result.error;
                msg.className = 'auth-error';
                msg.style.display = 'block';
            }
        });
    })();
    </script>
</body>
</html>
