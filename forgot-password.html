<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetare Parola - Note In demisol</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="background">
        <img src="assets/background.png" alt="" class="bg-image">
    </div>
    <div class="bg-overlay"></div>
    <div class="auth-page">
        <div class="auth-card">
            <h1>Note <span>In</span> Demisol</h1>
            <h2>Resetare Parola</h2>
            <div id="resetMsg" class="auth-error" style="display:none"></div>
            <div id="step1">
                <p class="auth-info">Introdu emailul cu care te-ai inregistrat. Vei primi un cod de resetare.</p>
                <form class="auth-form" id="forgotForm">
                    <input type="email" id="resetEmail" placeholder="Email-ul tau" required>
                    <button type="submit" class="auth-btn">Trimite codul</button>
                </form>
            </div>
            <div id="step2" style="display:none">
                <p class="auth-info">Introdu codul primit pe email si noua parola.</p>
                <form class="auth-form" id="resetForm">
                    <input type="text" id="resetCode" placeholder="Codul de resetare" required>
                    <input type="password" id="newPass" placeholder="Noua parola (minim 6 caractere)" required>
                    <input type="password" id="newPass2" placeholder="Confirma noua parola" required>
                    <button type="submit" class="auth-btn">Reseteaza parola</button>
                </form>
            </div>
            <p class="auth-switch"><a href="login.html">&#8592; Inapoi la autentificare</a></p>
            <a href="index.html" class="auth-back">&#8592; Inapoi la site</a>
        </div>
    </div>
    <script src="auth.js"></script>
    <script>
    var resetEmail = '';
    document.getElementById('forgotForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var msg = document.getElementById('resetMsg');
        var email = document.getElementById('resetEmail').value;
        var result = NIDAuth.forgotPassword(email);
        msg.textContent = result.message || result.error;
        msg.style.display = 'block';
        msg.style.color = result.ok ? '#4caf50' : '#c0392b';
        if (result.ok) {
            resetEmail = email;
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            msg.textContent = 'Codul tau de resetare: ' + result.code + ' (demonstrativ - in productie ar fi trimis pe email)';
        }
    });
    document.getElementById('resetForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var msg = document.getElementById('resetMsg');
        var code = document.getElementById('resetCode').value;
        var pass = document.getElementById('newPass').value;
        var pass2 = document.getElementById('newPass2').value;
        if (pass !== pass2) {
            msg.textContent = 'Parolele nu coincid';
            msg.style.color = '#c0392b';
            msg.style.display = 'block';
            return;
        }
        var result = NIDAuth.resetPassword(resetEmail, code, pass);
        if (result.ok) {
            msg.textContent = 'Parola a fost resetata cu succes! Redirectionare...';
            msg.style.color = '#4caf50';
            msg.style.display = 'block';
            setTimeout(function() { window.location.href = 'login.html'; }, 2000);
        } else {
            msg.textContent = result.error;
            msg.style.color = '#c0392b';
            msg.style.display = 'block';
        }
    });
    </script>
</body>
</html>
