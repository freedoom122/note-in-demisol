<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Note In demisol</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="background">
        <img src="assets/background.png" alt="" class="bg-image">
    </div>
    <div class="bg-overlay"></div>
    <div class="auth-page">
        <div class="auth-card">
            <h1>Note <span>In</span> Demisol</h1>
            <h2>Autentificare</h2>
            <form class="auth-form">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Parolă" required>
                <button type="submit" class="auth-btn">Autentificare</button>
            </form>
            <div class="auth-divider">
                <span>sau</span>
            </div>
            <div class="social-auth">
                <button class="social-btn google">
                    <span class="social-icon">G</span>
                    <span>Continuă cu Google</span>
                </button>
                <button class="social-btn facebook">
                    <span class="social-icon">f</span>
                    <span>Continuă cu Facebook</span>
                </button>
                <button class="social-btn instagram">
                    <span class="social-icon">&#9400;</span>
                    <span>Continuă cu Instagram</span>
                </button>
            </div>
            <p class="auth-switch">Nu ai cont? <a href="signup.html">Înregistrează-te</a></p>
            <a href="index.html" class="auth-back">&#8592; Înapoi la site</a>
        </div>
    </div>
</body>
</html>
