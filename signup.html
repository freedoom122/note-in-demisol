<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inregistrare - Note In demisol</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="background">
        <img src="assets/background.png" alt="" class="bg-image">
    </div>
    <div class="bg-overlay"></div>
    <div class="auth-page">
        <div class="auth-card">
            <h1>Note <span>In</span> Demisol</h1>
            <h2>Creare Cont</h2>
            <div id="authError" class="auth-error" style="display:none"></div>
            <form class="auth-form" id="signupForm" novalidate>
                <div class="auth-input-wrap">
                    <input type="text" id="signupUser" placeholder="Username" required autocomplete="username" pattern="[a-zA-Z0-9_]+">
                </div>
                <div class="auth-input-wrap">
                    <input type="email" id="signupEmail" placeholder="Email" required autocomplete="email">
                </div>
                <div class="auth-input-wrap">
                    <input type="password" id="signupPass" placeholder="Parola (minim 6 caractere)" required autocomplete="new-password">
                    <button type="button" class="password-toggle" id="togglePass" tabindex="-1">Arata</button>
                </div>
                <div class="password-strength" id="passStrength">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
                <div class="auth-input-wrap">
                    <input type="password" id="signupPass2" placeholder="Confirma parola" required autocomplete="new-password">
                </div>
                <button type="submit" class="auth-btn" id="signupBtn">Creaza cont</button>
            </form>
            <div class="auth-divider">
                <span>sau</span>
            </div>
            <div class="social-auth">
                <button class="social-btn google" id="googleBtn">
                    <span class="social-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg></span>
                    <span>Inregistrare cu Google</span>
                </button>

                <button class="social-btn apple" onclick="alert('Apple Sign-In disponibil in curand')">
                    <span class="social-icon">&#63743;</span>
                    <span>Inregistrare cu Apple</span>
                </button>
                <button class="social-btn github" onclick="alert('GitHub Sign-In disponibil in curand')">
                    <span class="social-icon">
                        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                    </span>
                    <span>Inregistrare cu GitHub</span>
                </button>
                <button class="social-btn discord" onclick="alert('Discord Sign-In disponibil in curand')">
                    <span class="social-icon">
                        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                    </span>
                    <span>Inregistrare cu Discord</span>
                </button>
            </div>
            <p class="auth-switch">Ai deja cont? <a href="login.html">Autentifica-te</a></p>
            <a href="index.html" class="auth-back">&#8592; Inapoi la site</a>
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="social-config.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <script>
    (function() {
        var API = '/api';
        var err = document.getElementById('authError');
        var btn = document.getElementById('signupBtn');
        var passInput = document.getElementById('signupPass');
        var pass2Input = document.getElementById('signupPass2');
        var toggleBtn = document.getElementById('togglePass');
        var strengthBars = document.querySelectorAll('#passStrength .bar');

        toggleBtn.addEventListener('click', function() {
            var isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            toggleBtn.textContent = isPass ? 'Ascunde' : 'Arata';
        });

        function calcStrength(pw) {
            var score = 0;
            if (pw.length >= 6) score++;
            if (pw.length >= 10) score++;
            if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
            if (/\d/.test(pw)) score++;
            if (/[^a-zA-Z0-9]/.test(pw)) score++;
            return score;
        }

        passInput.addEventListener('input', function() {
            var score = calcStrength(passInput.value);
            var levels = ['', 'weak', 'medium', 'strong', 'strong', 'strong'];
            strengthBars.forEach(function(bar, i) {
                bar.className = 'bar' + (i < score ? ' ' + levels[score] : '');
            });
            if (pass2Input.value && passInput.value !== pass2Input.value) {
                pass2Input.classList.add('error');
            } else {
                pass2Input.classList.remove('error');
            }
        });

        pass2Input.addEventListener('input', function() {
            if (passInput.value && pass2Input.value) {
                if (passInput.value === pass2Input.value) {
                    pass2Input.classList.remove('error');
                    pass2Input.classList.add('valid');
                } else {
                    pass2Input.classList.remove('valid');
                    pass2Input.classList.add('error');
                }
            } else {
                pass2Input.classList.remove('error', 'valid');
            }
        });

        [document.getElementById('signupUser'), document.getElementById('signupEmail'), passInput, pass2Input].forEach(function(el) {
            el.addEventListener('input', function() {
                if (err.style.display === 'block') err.style.display = 'none';
            });
        });

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var username = document.getElementById('signupUser').value.trim();
            var email = document.getElementById('signupEmail').value.trim();
            var password = passInput.value;
            var pass2 = pass2Input.value;

            if (!username || !email || !password || !pass2) {
                err.textContent = 'Completeaza toate campurile';
                err.style.display = 'block';
                return;
            }
            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                err.textContent = 'Username poate contine doar litere, cifre si underscore';
                err.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                err.textContent = 'Parola trebuie sa aiba minim 6 caractere';
                err.style.display = 'block';
                return;
            }
            if (password !== pass2) {
                err.textContent = 'Parolele nu coincid';
                err.style.display = 'block';
                return;
            }
            btn.disabled = true;
            btn.classList.add('loading');
            var result = NIDAuth.register(username, email, password);
            btn.disabled = false;
            btn.classList.remove('loading');
            if (result.ok) {
                NIDAuth.login(username, password);
                window.location.href = 'index.html';
            } else {
                err.textContent = result.error;
                err.style.display = 'block';
            }
        });

        function socialLogin(path, body) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', API + path, false);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify(body));
            try {
                var res = JSON.parse(xhr.responseText);
                if (res.ok) {
                    localStorage.setItem('nid_jwt', res.token);
                    localStorage.setItem('nid_session', JSON.stringify(res.user));
                    window.location.href = 'index.html';
                } else {
                    err.textContent = res.error;
                    err.style.display = 'block';
                }
            } catch(e) {
                err.textContent = 'Eroare la autentificare';
                err.style.display = 'block';
            }
        }

        function isGoogleConfigured() {
            return SOCIAL_CONFIG.GOOGLE_CLIENT_ID && SOCIAL_CONFIG.GOOGLE_CLIENT_ID.indexOf('aici_pune') === -1;
        }

        document.getElementById('googleBtn').addEventListener('click', function() {
            if (!isGoogleConfigured()) {
                err.textContent = 'Google Sign-In nu este configurat. Completeaza SOCIAL_CONFIG.GOOGLE_CLIENT_ID in social-config.js';
                err.style.display = 'block';
                return;
            }
            google.accounts.id.initialize({
                client_id: SOCIAL_CONFIG.GOOGLE_CLIENT_ID,
                callback: function(response) {
                    if (response.credential) {
                        socialLogin('/auth/google', { credential: response.credential });
                    }
                }
            });
            google.accounts.id.prompt();
        });
    })();
    </script>
</body>
</html>
