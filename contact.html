            <h2>Contact</h2>
            <div class="contact-info">
                <div class="info-item">
                    <h3>Email</h3>
                    <p>contact@noteindemisol.ro</p>
                </div>
                <div class="info-item">
                    <h3>Telefon</h3>
                    <p>+40 7XX XXX XXX</p>
                </div>

                    <p>Facebook | Instagram | YouTube</p>
                </div>
            </div>
            <form class="contact-form">
                <h3>Trimite-ne un mesaj</h3>
                <input type="text" placeholder="Numele tău" required>
                <input type="email" placeholder="Email-ul tău" required>
                <textarea placeholder="Mesajul tău" required></textarea>
                <button type="submit">Trimite Mesaj</button>
            </form>
