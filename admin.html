<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Note In demisol</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="background">
        <img src="assets/background.png" alt="" class="bg-image">
    </div>
    <div class="bg-overlay"></div>
    <div class="admin-layout" id="adminLayout">
        <aside class="admin-sidebar">
            <h2>NID Admin</h2>
            <nav class="admin-nav">
                <a href="#" class="admin-nav-item active" data-section="dashboard">
                    <span class="nav-icon">&#8962;</span>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="admin-nav-item" data-section="events">
                    <span class="nav-icon">&#9733;</span>
                    <span>Evenimente</span>
                </a>
                <a href="#" class="admin-nav-item" data-section="users">
                    <span class="nav-icon">&#9830;</span>
                    <span>Utilizatori</span>
                </a>
                <a href="#" class="admin-nav-item" data-section="subscriptions">
                    <span class="nav-icon">&#9993;</span>
                    <span>Subscriptii</span>
                </a>
                <a href="#" class="admin-nav-item" data-section="bans">
                    <span class="nav-icon">&#128683;</span>
                    <span>Banuri</span>
                </a>
                <a href="#" class="admin-nav-item" data-section="settings">
                    <span class="nav-icon">&#9881;</span>
                    <span>Setari</span>
                </a>
            </nav>
            <a href="index.html" class="admin-back">&#8592; Site</a>
        </aside>
        <main class="admin-main" id="adminMain">
            <div class="admin-header">
                <h1>Panou de Administrare</h1>
                <p id="adminStatus">Bine ai venit, administrator</p>
            </div>
            <div id="adminContent"></div>
        </main>
    </div>
    <div id="adminDenied" style="display:none">
        <div class="denied-page">
            <div class="denied-card">
                <div class="denied-code">446</div>
                <h1>Acces <span>Interzis</span></h1>
                <p class="denied-desc">Nu ai permisiunea de a accesa aceasta pagina.<br>Trebuie sa fii administrator.</p>
                <div class="denied-actions">
                    <a href="login.html" class="denied-btn primary">Autentifica-te</a>
                    <a href="index.html" class="denied-btn secondary">&#8592; Inapoi la site</a>
                </div>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
    <script>
    (function() {
        var session = NIDAuth.getSession();
        if (!session || !session.isAdmin) {
            document.getElementById('adminDenied').style.display = '';
            document.getElementById('adminLayout').style.display = 'none';
            return;
        }
        document.getElementById('adminStatus').textContent = 'Bine ai venit, ' + session.username;
        var events = JSON.parse(localStorage.getItem('nid_events')) || [
            { id: 1, name: 'Concert de Primavara', date: '15 Mai 2026', location: 'Sala Concerturilor', desc: 'Performanta live cu repertoriu clasic si modern' },
            { id: 2, name: 'Workshop Tehnici Avansate', date: '1-3 Iun 2026', location: 'Studioul Nostru', desc: 'Tehnici de sweep picking, tapping si legato' },
            { id: 3, name: 'Festival de Chitare', date: '20-22 Iul 2026', location: 'Parcul Central', desc: 'Concerte, workshop-uri si jam sessions' }
        ];
        var subscribers = JSON.parse(localStorage.getItem('nid_subscribers')) || [];
        var bannedIPs = JSON.parse(localStorage.getItem('nid_banned')) || [];
        var currentSection = 'dashboard';
        function saveEvents() { localStorage.setItem('nid_events', JSON.stringify(events)); }
        function saveSubscribers() { localStorage.setItem('nid_subscribers', JSON.stringify(subscribers)); }
        function saveBans() { localStorage.setItem('nid_banned', JSON.stringify(bannedIPs)); }
        function renderSection(section) {
            currentSection = section;
            document.querySelectorAll('.admin-nav-item').forEach(function(el) { el.classList.remove('active'); });
            document.querySelector('.admin-nav-item[data-section="' + section + '"]').classList.add('active');
            var content = document.getElementById('adminContent');
            if (section === 'dashboard') {
                content.innerHTML = '<div class="admin-cards-row">' +
                    '<div class="admin-stat-card"><span class="stat-num">' + events.length + '</span><span class="stat-label">Evenimente</span></div>' +
                    '<div class="admin-stat-card"><span class="stat-num">' + (NIDAuth.getAllUsers().length || 0) + '</span><span class="stat-label">Utilizatori</span></div>' +
                    '<div class="admin-stat-card"><span class="stat-num">' + subscribers.length + '</span><span class="stat-label">Subscriptii</span></div>' +
                    '<div class="admin-stat-card"><span class="stat-num">' + bannedIPs.length + '</span><span class="stat-label">IP-uri blocate</span></div>' +
                    '</div>' +
                    '<div class="admin-card"><h3>Activitate recenta</h3><p>Sistemul functioneaza normal. ' + events.length + ' evenimente active, ' + bannedIPs.length + ' IP-uri blocate.</p></div>';
            } else if (section === 'events') {
                var html = '<div class="admin-card"><div class="admin-card-header"><h3>Evenimente</h3><button class="admin-btn" onclick="addEvent()">+ Adauga eveniment</button></div>';
                if (!events.length) { html += '<p class="admin-empty">Nu exista evenimente.</p>'; }
                else {
                    html += '<table class="admin-table"><thead><tr><th>Nume</th><th>Data</th><th>Locatie</th><th>Actiuni</th></tr></thead><tbody>';
                    events.forEach(function(ev) {
                        html += '<tr><td>' + ev.name + '</td><td>' + ev.date + '</td><td>' + ev.location + '</td><td>' +
                            '<button class="admin-btn small" onclick="editEvent(' + ev.id + ')">Editeaza</button> ' +
                            '<button class="admin-btn small danger" onclick="deleteEvent(' + ev.id + ')">Sterge</button></td></tr>';
                    });
                    html += '</tbody></table>';
                }
                html += '</div><div class="admin-card"><h3>Trimite notificare</h3><p>Trimite email despre un eveniment tuturor subscriptiilor.</p>' +
                    '<select id="notifEvent" class="admin-select">';
                events.forEach(function(ev) { html += '<option value="' + ev.id + '">' + ev.name + '</option>'; });
                html += '</select><button class="admin-btn" onclick="sendNotification()" style="margin-top:10px">Trimite email</button></div>';
                content.innerHTML = html;
            } else if (section === 'users') {
                var users = NIDAuth.getAllUsers();
                var html = '<div class="admin-card"><div class="admin-card-header"><h3>Utilizatori inregistrati</h3><span class="admin-badge">' + users.length + ' total</span></div>';
                if (!users.length) { html += '<p class="admin-empty">Nu exista utilizatori.</p>'; }
                else {
                    html += '<table class="admin-table"><thead><tr><th>Username</th><th>Email</th><th>Data</th><th>Rol</th><th>Actiuni</th></tr></thead><tbody>';
                    users.forEach(function(u) {
                        var roleBadge = u.isAdmin ? '<span class="admin-badge admin">Admin</span>' : '<span class="admin-badge member">Membru</span>';
                        var actionBtn = u.isAdmin ? '<span class="admin-text-muted">deja admin</span>' : '<button class="admin-btn small" onclick="promoteUser(\'' + u.username + '\')">Promoveaza</button>';
                        if (u.username === 'alexczirai' || u.username === 'marcuadmin') actionBtn = '<span class="admin-text-muted">admin permanent</span>';
                        html += '<tr><td>' + u.username + '</td><td>' + u.email + '</td><td>' + new Date(u.createdAt).toLocaleDateString('ro-RO') + '</td><td>' + roleBadge + '</td><td>' + actionBtn + '</td></tr>';
                    });
                    html += '</tbody></table>';
                }
                html += '</div>';
                content.innerHTML = html;
            } else if (section === 'subscriptions') {
                var html = '<div class="admin-card"><div class="admin-card-header"><h3>Subscriptii la newsletter</h3><button class="admin-btn" onclick="addSubscriber()">+ Adauga manual</button></div>';
                if (!subscribers.length) { html += '<p class="admin-empty">Nu exista subscriptii.</p>'; }
                else {
                    html += '<table class="admin-table"><thead><tr><th>Email</th><th>Data</th><th>Actiuni</th></tr></thead><tbody>';
                    subscribers.forEach(function(s, i) {
                        html += '<tr><td>' + s.email + '</td><td>' + s.date + '</td><td><button class="admin-btn small danger" onclick="deleteSubscriber(' + i + ')">Sterge</button></td></tr>';
                    });
                    html += '</tbody></table>';
                }
                html += '</div>';
                content.innerHTML = html;
            } else if (section === 'bans') {
                var html = '<div class="admin-card"><div class="admin-card-header"><h3>IP-uri blocate</h3><button class="admin-btn" onclick="banIP()">+ Blocheaza IP</button></div>';
                if (!bannedIPs.length) { html += '<p class="admin-empty">Nu exista IP-uri blocate.</p>'; }
                else {
                    html += '<table class="admin-table"><thead><tr><th>Adresa IP</th><th>Data blocarii</th><th>Motiv</th><th>Actiuni</th></tr></thead><tbody>';
                    bannedIPs.forEach(function(b, i) {
                        html += '<tr><td>' + b.ip + '</td><td>' + b.date + '</td><td>' + (b.reason || 'Nespecificat') + '</td><td><button class="admin-btn small" onclick="unbanIP(' + i + ')">Deblocheaza</button></td></tr>';
                    });
                    html += '</tbody></table>';
                }
                html += '</div><div class="admin-card"><h3>Blocheaza utilizator dupa username</h3>' +
                    '<p>Introdu username-ul pe care vrei sa-l blochezi.</p>' +
                    '<div style="display:flex;gap:10px"><input type="text" id="banUsername" class="admin-input" placeholder="Username" style="flex:1;margin:0">' +
                    '<button class="admin-btn" onclick="banByUsername()">Blocheaza</button></div></div>';
                content.innerHTML = html;
            } else if (section === 'settings') {
                content.innerHTML = '<div class="admin-card"><h3>Setari generale</h3>' +
                    '<div class="admin-setting"><label>Nume site</label><input type="text" class="admin-input" value="Note In Demisol"></div>' +
                    '<div class="admin-setting"><label>Email contact</label><input type="email" class="admin-input" value="contact@noteindemisol.ro"></div>' +
                    '<button class="admin-btn" onclick="alert(\'Setarile au fost salvate (demonstrativ)\')">Salveaza setarile</button></div>' +
                    '<div class="admin-card"><h3>Export date</h3><p>Exporta lista de utilizatori sau subscriptii.</p>' +
                    '<button class="admin-btn" onclick="exportUsers()">Exporta utilizatori</button> ' +
                    '<button class="admin-btn" onclick="exportSubscribers()">Exporta subscriptii</button></div>' +
                    '<div class="admin-card" style="border-color:rgba(192,57,43,0.2)"><h3 style="color:#c0392b">Zona de risc</h3><p>Sterge toti utilizatorii si reseteaza sistemul.</p>' +
                    '<button class="admin-btn danger" onclick="resetSystem()">Reseteaza tot</button></div>';
            }
        }

        window.addEvent = function() {
            var name = prompt('Numele evenimentului:');
            if (!name) return;
            var date = prompt('Data evenimentului:');
            if (!date) return;
            var location = prompt('Locatia:');
            if (!location) return;
            var desc = prompt('Descriere (optional):') || '';
            var id = events.length ? Math.max.apply(null, events.map(function(e) { return e.id; })) + 1 : 1;
            events.push({ id: id, name: name, date: date, location: location, desc: desc });
            saveEvents();
            renderSection('events');
        };

        window.editEvent = function(id) {
            var ev = events.filter(function(e) { return e.id === id; })[0];
            if (!ev) return;
            var name = prompt('Nume:', ev.name);
            if (!name) return;
            var date = prompt('Data:', ev.date);
            if (!date) return;
            var location = prompt('Locatia:', ev.location);
            if (!location) return;
            ev.name = name; ev.date = date; ev.location = location;
            saveEvents();
            renderSection('events');
        };

        window.deleteEvent = function(id) {
            if (!confirm('Stergi evenimentul?')) return;
            events = events.filter(function(e) { return e.id !== id; });
            saveEvents();
            renderSection('events');
        };

        window.addSubscriber = function() {
            var email = prompt('Email subscriptie:');
            if (!email) return;
            subscribers.push({ email: email, date: new Date().toLocaleDateString('ro-RO') });
            saveSubscribers();
            renderSection('subscriptions');
        };

        window.deleteSubscriber = function(index) {
            if (!confirm('Stergi subscriptia?')) return;
            subscribers.splice(index, 1);
            saveSubscribers();
            renderSection('subscriptions');
        };

        window.sendNotification = function() {
            var select = document.getElementById('notifEvent');
            if (!select) return;
            var evId = parseInt(select.value);
            var ev = events.filter(function(e) { return e.id === evId; })[0];
            if (!ev || !subscribers.length) {
                alert('Nu exista subscriptii sau evenimentul nu a fost gasit.');
                return;
            }
            alert('Notificare trimisa la ' + subscribers.length + ' subscriptii pentru: ' + ev.name + ' (pe backend s-ar trimite emailuri reale)');
        };

        window.promoteUser = function(username) {
            if (!confirm('Promovezi pe @"' + username + '" la administrator?')) return;
            var result = NIDAuth.promoteToAdmin(username);
            if (result.ok) { renderSection('users'); }
            else { alert(result.error); }
        };

        window.banIP = function() {
            var ip = prompt('Adresa IP de blocat (ex: 192.168.1.1):');
            if (!ip) return;
            if (bannedIPs.some(function(b) { return b.ip === ip; })) { alert('IP-ul este deja blocat.'); return; }
            bannedIPs.push({ ip: ip, date: new Date().toLocaleDateString('ro-RO'), reason: 'Blocat manual' });
            saveBans();
            renderSection('bans');
        };

        window.unbanIP = function(index) {
            if (!confirm('Deblochezi IP-ul ' + bannedIPs[index].ip + '?')) return;
            bannedIPs.splice(index, 1);
            saveBans();
            renderSection('bans');
        };

        window.banByUsername = function() {
            var username = document.getElementById('banUsername');
            if (!username || !username.value) { alert('Introdu un username.'); return; }
            var users = NIDAuth.getAllUsers();
            var user = null;
            for (var i = 0; i < users.length; i++) {
                if (users[i].username === username.value.trim().toLowerCase()) { user = users[i]; break; }
            }
            if (!user) { alert('Username-ul nu exista.'); return; }
            if (bannedIPs.some(function(b) { return b.ip === user.username; })) { alert('Utilizatorul este deja blocat.'); return; }
            bannedIPs.push({ ip: user.username + ' (username)', date: new Date().toLocaleDateString('ro-RO'), reason: 'Blocat dupa username: ' + user.email });
            saveBans();
            username.value = '';
            renderSection('bans');
        };

        window.exportUsers = function() {
            var users = NIDAuth.getAllUsers();
            var text = 'Username,Email,Data inregistrare,Rol\n';
            users.forEach(function(u) {
                text += u.username + ',' + u.email + ',' + new Date(u.createdAt).toLocaleDateString('ro-RO') + ',' + (u.isAdmin ? 'Admin' : 'Membru') + '\n';
            });
            var blob = new Blob([text], { type: 'text/csv' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'utilizatori_nid.csv';
            a.click();
        };

        window.exportSubscribers = function() {
            var text = 'Email,Data\n';
            subscribers.forEach(function(s) { text += s.email + ',' + s.date + '\n'; });
            var blob = new Blob([text], { type: 'text/csv' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'subscriptii_nid.csv';
            a.click();
        };

        window.resetSystem = function() {
            if (!confirm('ATENTIE! Aceasta actiune sterge TOTI utilizatorii si evenimentele. Esti sigur?')) return;
            if (!confirm('Ultima confirmare: vrei sa resetezi complet sistemul?')) return;
            localStorage.removeItem('nid_users');
            localStorage.removeItem('nid_events');
            localStorage.removeItem('nid_subscribers');
            localStorage.removeItem('nid_banned');
            NIDAuth.seedAdmins();
            events = [];
            subscribers = [];
            bannedIPs = [];
            alert('Sistemul a fost resetat. Adminii默认 au fost recreati.');
            renderSection('dashboard');
        };

        document.querySelectorAll('.admin-nav-item').forEach(function(item) {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                renderSection(this.getAttribute('data-section'));
            });
        });
        renderSection('dashboard');
    })();
    </script>
</body>
</html>
