<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social - Note In demisol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <img src="assets/background.png" alt="" class="bg-image">
    </div>
    <div class="bg-overlay"></div>
    <div class="container">
        <div class="menu-toggle" id="menuToggle"><div class="menu-icon"><span></span><span></span><span></span></div></div>
        <div class="menu-circle" id="menuCircle">
            <a href="index.html" class="menu-item"><span class="item-icon">&#8962;</span><span class="item-label">Acasă</span></a>
            <a href="about.html" class="menu-item"><span class="item-icon">&#9835;</span><span class="item-label">Despre</span></a>
            <a href="members.html" class="menu-item"><span class="item-icon">&#9830;</span><span class="item-label">Echipa</span></a>
            <a href="lessons.html" class="menu-item"><span class="item-icon">&#9834;</span><span class="item-label">Lectii</span></a>
            <a href="events.html" class="menu-item"><span class="item-icon">&#9733;</span><span class="item-label">Evenimente</span></a>
            <a href="gallery.html" class="menu-item"><span class="item-icon">&#128247;</span><span class="item-label">Galerii</span></a>
            <a href="contact.html" class="menu-item"><span class="item-icon">&#9993;</span><span class="item-label">Contact</span></a>
            <a href="blog.html" class="menu-item"><span class="item-icon">&#9998;</span><span class="item-label">Blog</span></a>
            <a href="social.html" class="menu-item"><span class="item-icon">&#64;</span><span class="item-label">Social</span></a>
        </div>
        <section class="content-section">
            <h2>Social</h2>
            <div class="social-links" id="socialLinks"><p style="text-align:center;color:#5a4a3a">Se incarca...</p></div>
            <p class="social-text">Urmareste-ne pentru lectii live, behind-the-scenes si continut exclusiv!</p>
        </section>
    </div>
    <script>
    (function() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/content/site-content', false);
        try { xhr.send(); } catch(e) {}
        var content = {};
        try { content = JSON.parse(xhr.responseText).content || {}; } catch(e) {}
        var links = [
            { key: 'social_facebook', label: 'Facebook', icon: 'f' },
            { key: 'social_youtube', label: 'YouTube', icon: '&#9654;' },
            { key: 'social_instagram', label: 'Instagram', icon: '&#9400;' },
            { key: 'social_tiktok', label: 'TikTok', icon: '&#9834;' }
        ];
        var container = document.getElementById('socialLinks');
        container.innerHTML = '';
        links.forEach(function(l) {
            var url = content[l.key] ? content[l.key].content : '#';
            container.innerHTML += '<a href="' + url + '" target="_blank" class="social-item"><span class="icon">' + l.icon + '</span><span class="label">' + l.label + '</span></a>';
        });
    })();
    </script>
    <script src="script.js"></script>
</body>
</html>
