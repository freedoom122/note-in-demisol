<body>
    <div class="background">
        <img src="assets/background.png" alt="" class="bg-image">
    </div>
    <div class="bg-overlay"></div>
    <div class="container">
        <div class="menu-toggle" id="menuToggle">
            <div class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <div class="menu-circle" id="menuCircle">
            <a href="index.html" class="menu-item"><span class="item-icon">&#8962;</span><span class="item-label">Acasă</span></a>
            <a href="about.html" class="menu-item"><span class="item-icon">&#9835;</span><span class="item-label">Despre</span></a>
            <a href="members.html" class="menu-item"><span class="item-icon">&#9830;</span><span class="item-label">Echipa</span></a>
            <a href="lessons.html" class="menu-item"><span class="item-icon">&#9834;</span><span class="item-label">Lectii</span></a>

        </div>
        <section class="content-section">
            <h2>Evenimente</h2>
            <div class="events-timeline" id="eventsList">
                <p style="text-align:center;color:#5a4a3a">Se incarca...</p>
            </div>
        </section>
    </div>
    <script src="auth.js"></script>
    <script>
    (function() {
        var list = document.getElementById('eventsList');
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/events', false);
        try { xhr.send(); } catch(e) {}
        var events = [];
        try { events = JSON.parse(xhr.responseText).events || []; } catch(e) {}
        var now = new Date();
        var upcoming = events.filter(function(ev) {
            var end = ev.endDate ? new Date(ev.endDate + 'T' + (ev.endTime || '23:59')) : null;
            return !end || end >= now;
        });
        if (!upcoming.length) {
            list.innerHTML = '<p style="text-align:center;color:#5a4a3a">Momentan nu sunt evenimente planificate.</p>';
        } else {
            list.innerHTML = '';
            upcoming.forEach(function(ev) {
                var dateStr = ev.date;
                if (ev.endDate && ev.endDate !== ev.date) dateStr += ' - ' + ev.endDate;
                var timeStr = (ev.startTime || '') + (ev.endTime ? ' - ' + ev.endTime : '');
                var dateTimeStr = dateStr + (timeStr ? ' | ' + timeStr : '');
                list.innerHTML += '<div class="event">' +
                    '<h3>' + ev.name + '</h3>' +
                    '<p>' + dateTimeStr + ' - ' + ev.location + '</p>' +
                    (ev.description ? '<p>' + ev.description + '</p>' : '') +
                    '</div>';
            });
        }
    })();
    </script>
    <script src="script.js"></script>
</body>
</html>
